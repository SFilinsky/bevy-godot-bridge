[package]
name = "bevy_godot4"
version = "0.3.0"
edition = "2024"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[features]
# Expose inspection methods used only by Godot regression tests and benchmark counters.
bridge-test-api = ["bevy_godot4_proc_macros/bridge-test-api"]
# serde = ["godot/serde"]
assets = [] # experimental feature, see assets::GodotResourceLoader
# The recording implementation is available in debug builds or explicitly profiled releases.
dev-observability = ["dep:memory-stats"]
profiled-release = ["dev-observability"]
# Records detailed timings for outbound bridge queues. Keep this off in normal
# builds so collecting bridge metrics has no runtime cost.
bridge-transport-profiling = []

[dependencies]
godot-apis = { path = "godot-apis" }
memory-stats = { version = "1.2", optional = true }
anyhow = "1"
bevy = { version = "0.18", default-features = false, features = ["bevy_asset", "bevy_state", "bevy_log"] }
godot = "0.4.5"
bevy_godot4_proc_macros = { path = "./proc_macros" }
once_cell = "1.21.3"
dashmap = "6.0.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
